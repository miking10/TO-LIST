      <!-- ================= MAIN ================= -->
      <main class="main">
        <!-- Header -->
        <header class="header">
          <div>
            <h1 id="greating"></h1>
            <p>Here's what's happening with your tasks today.</p>
          </div>

          <div class="header-right">
            <span class="date"></span>

            <button class="dark-mode">
              <i class="fa-solid fa-moon"></i>
            </button>
          </div>
        </header>

        <!-- ================= STATISTICS ================= -->
        <section class="stats">
          <div class="stat-card total">
            <div class="stat-top">
              <div class="stat-icon">

                  height="32"

              </div>

              <div>
                <span>Total Tasks</span>
                <strong id="totalTask"></strong>
              </div>
            </div>

            <p>All tasks in your list</p>
          </div>

          <div class="stat-card completed">
            <div class="stat-top">
              <div class="stat-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="32"
                  height="32"
                  fill="#f8f1f1"
                  viewBox="0 0 256 256"

                  <path
                    d="M173.66,98.34a8,8,0,0,1,0,11.32l-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35A8,8,0,0,1,173.66,98.34ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"
                  ></path>
                </svg>
              </div>

              <div>
                <span>Completed</span>
                <strong id="completedTask"></strong>
              </div>
            </div>

            <p>Great job!</p>
          </div>

          <div class="stat-card pending">
            <div class="stat-top">
              <div class="stat-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="32"
                  height="32"
                  fill="#f8f1f1"
                  viewBox="0 0 256 256"
                >
                  <path
                    d="M200,75.64V40a16,16,0,0,0-16-16H72A16,16,0,0,0,56,40V76a16.07,16.07,0,0,0,6.4,12.8L114.67,128,62.4,167.2A16.07,16.07,0,0,0,56,180v36a16,16,0,0,0,16,16H184a16,16,0,0,0,16-16V180.36a16.09,16.09,0,0,0-6.35-12.77L141.27,128l52.38-39.6A16.05,16.05,0,0,0,200,75.64ZM72,40H184V75.64L178.23,80H77.33L72,76Zm56,78L98.67,96h58.4Zm56,98H72V180l48-36v24a8,8,0,0,0,16,0V144.08l48,36.28Z"
                  ></path>
                </svg>
              </div>

              <div>
                <span>Pending</span>
                <strong id="pandingTask"></strong>
              </div>
            </div>

            <p>Keep going!</p>
          </div>
        </section>

        <!-- ================= ADD TASK ================= -->
        <section class="add-task">
          <!-- Part 1: Task -->
          <div class="task-input">
            <i class="fa-solid fa-plus"></i>

            <input
              type="text"
              id="taskInput"
              placeholder="What needs to be done?"
              required
            />
          </div>

          <!-- Part 2: Date -->
          <div class="date-input">
            <i class="fa-regular fa-calendar"></i>

            <input type="date" id="taskDate" required />
          </div>

          <!-- Part 3: Add Button -->
          <button id="addTask" class="add-btn">
            <i class="fa-solid fa-plus"></i>
            Add Task
          </button>
        </section>

        <!-- ================= FILTER ================= -->
        <section class="task-header">
          <div class="filters">
            <button class="filter active">All</button>

            <button class="filter">Active</button>

            <button class="filter">Completed</button>

            <button class="filter">Important</button>
          </div>

          <button class="sort">
            Sort by
            <i class="fa-solid fa-chevron-down"></i>
          </button>
        </section>
